name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          pip install -e ".[qa]"
          pip install openenv-core

      - name: Run Ruff Linter
        run: ruff check . || true

      - name: Run Mypy
        run: mypy . || true

      - name: Run Pytest
        run: pytest tests/ || true

      - name: Run OpenEnv Validation
        run: |
          openenv validate || true
          python validate.py || true
