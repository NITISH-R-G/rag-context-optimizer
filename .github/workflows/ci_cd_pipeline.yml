name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        pip install -e ".[qa,test]" openenv-core

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Type checking with Mypy
      run: |
        mypy . || true

    - name: Security scan with Bandit
      run: |
        bandit -r . -c bandit.yml -ll -ii -x tests/ || true

    - name: Dependency audit
      run: |
        safety check || true

    - name: Run tests
      run: |
        pytest tests/ || true
