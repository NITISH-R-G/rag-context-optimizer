name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |

        pip install -e ".[test]"
        pip install ruff mypy bandit safety openenv-core

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Type checking with Mypy
      run: |
        mypy .

    - name: Security scan with Bandit
      run: |
        bandit -r . -ll -ii -x tests/

    - name: Dependency audit
      run: |
        safety check

    - name: Run tests
      run: |
        pytest tests/ || true
